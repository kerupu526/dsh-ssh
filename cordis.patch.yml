# The dsh-ssh bundle patch: SSH remote development over the dsh-web-app layer.
#
# Rows here are overridden by the profile's own cordis.patch.yml and any
# --patch overlays, so a deployment can retune or disable any of them.
#
# - The aggregate `ssh-remote` row mounts ctx.ssh / ctx.subprocess / ctx.fs and
#   makes the client bundle scannable. Its connection is a placeholder: nothing
#   connects lazily — real remote work happens on registry connections created
#   in the web UI and persisted to ~/.dsh/dsh-ssh-connections.json.
# - The default host directory picker is disabled because dsh-ssh's client UI
#   (sidebar + browser, plus the native system chooser) takes over the whole
#   add-workspace flow.

# 关闭默认 -auto picker（它动态挂载的界面随行一起消失）
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-auto'
  disabled: true

- insert:
    # ctx.ssh / ctx.subprocess / ctx.fs 三个远程 provider（占位连接，懒建立）
    - id: ssh-remote
      name: dsh-ssh
      config:
        host: 127.0.0.1
        port: 22
        username: ssh
        cwd: /tmp

    # 本机/远程目录 browse 后端
    - id: directory-picker-ssh
      name: dsh-ssh/picker
      config:
        maxEntries: 1000

    # 多连接注册表 + /dsh-ssh RPC（持久化、连接管理、远程目录浏览）
    - id: ssh-web-channel
      name: dsh-ssh/web
      config:
        maxEntries: 1000

    # 远程预设：关闭 PowerShell 工具、启用 bash 工具，使 Windows 主机上的会话在远程 Linux 里用 bash 语法工作。
    # Remote preset: swaps the PowerShell tool for bash, so a Windows host talks bash to a POSIX remote.
    # Select it in the agent-preset picker for SSH workspaces; keep "standard" for local ones.
    - id: preset-remote
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: remote
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model. Your
                workspace and shell are on a remote POSIX host reached over SSH;
                use bash syntax and POSIX paths, not PowerShell or Windows paths.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
